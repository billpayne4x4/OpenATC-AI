[package]
name = "openatc-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "openatc_ui"
path = "src/lib.rs"

[dependencies]
imgui = { version = "0.12", features = ["tables-api"] }
openatc-http = { path = "../http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openatc-core = { path = "../core" }
openatc-settings = { path = "../settings" }
openatc-audio = { path = "../audio" }

arboard = { version = "3.6", default-features = false }

[lints]
workspace = true
