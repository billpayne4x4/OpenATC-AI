[package]
name = "openatc-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "openatc-desktop"
path = "src/main.rs"

[dependencies]
imgui = { version = "0.12", features = ["tables-api"] }
imgui-glow-renderer = "0.13"
imgui-winit-support = "0.13"
glow = "0.14"
glutin = "0.32"
glutin-winit = "0.5"
winit = "0.30"
openatc-ui = { path = "../ui" }
openatc-core = { path = "../core" }
serde_json = "1"
