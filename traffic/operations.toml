# Generated traffic routing, radio and movement limits.
version = 1
# Includes filed endpoints when available; other pairs need compatible fleets and fresh simulator weather.
network_airport_limit = 4
# Concurrent controller-managed flights. Other prepared flights wait at their stands.
sequenced_flight_limit = 16
network_candidate_limit = 16
network_radius_nm = 750.0
flight_clearance_lead_seconds = 120.0
holding_turn_rate_degrees_sec = 3.0
# Conservative IAS ceiling for separately protected, controller-specified limit holds.
contingency_holding_maximum_ias = 200.0
pushback_knots = 3.0
pushback_radius_scale = 0.6
pushback_max_meters = 250.0
preparation_seconds_min = 5.0
preparation_seconds_max = 20.0
surface_sample_meters = 5.0
surface_segment_meters = 25.0
conflict_cell_meters = 50.0
stand_clearance_meters = 60.0
maximum_surface_segments = 512
radio_characters_per_second = 14.0
radio_gap_seconds = 1.0
runway_clearance_buffer_seconds = 20.0

# Surface observations and verified apron connections for generated arrivals.
surface_monitor_radius_nm = 50.0
gate_connector_meters = 350.0
gate_connector_detour_meters = 250.0

# Maximum retained terminal combinations for the airborne planner.
terminal_candidate_limit = 16

# Maximum published heading-to-course intercept considered during terminal decoding.
terminal_intercept_limit_nm = 20.0

# Maximum distance between nominal en-route crossing inputs.
enroute_segment_nm = 20.0

# Nominal airborne geometry; movement still requires a separate protection check.
airborne_sample_meters = 250.0
airborne_detour_meters = 5000.0
airborne_turn_rate_degrees_sec = 3.0
# Fallback radar minima, used when a wake standard has no [separation] table. The lateral
# value applies en route; the terminal value applies inside terminal airspace. Vertical
# minima apply below FL290 and at FL290 and above.
airborne_separation_nm = 5.0
airborne_terminal_separation_nm = 5.0
airborne_separation_low_feet = 2000.0
airborne_separation_feet = 2000.0
airborne_prediction_seconds = 180.0

# Supported slope for the nominal published-threshold runway surface.
runway_slope_limit_percent = 2.0

# Visual/TCAS selection only; distant flight state remains in the movement world.
visible_aircraft_limit = 63
display_enter_nm = 40.0
display_leave_nm = 50.0
display_replacement_margin_nm = 2.0
same_direction_limit = 3
trailing_limit = 2
same_direction_cone_degrees = 30.0
same_direction_range_nm = 15.0
