# Nominal simulation envelopes. These are not dispatch performance tables.
version = 1

[spacing]
start_nm = 8.0
end_nm = 20.0
release_nm = 5.0
maximum_altitude_feet = 10000.0
lateral_meters = 500.0
alignment_degrees = 20.0
vertical_feet = 1500.0
gap_min_nm = 3.0
gap_max_nm = 6.0
closing_knots = 15.0
speed_step_knots = 10.0
minimum_change_knots = 5.0

# Simulation planning margins, not published separation minima.
[spacing.prediction]
reaction_seconds = 15.0
deceleration = 0.5
release_nm = 5.0
buffer_nm = 0.5
runway_seconds = 90.0

