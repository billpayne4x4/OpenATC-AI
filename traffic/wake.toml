# Wake turbulence and runway-relationship policy.
# The editable layout is traffic/wake/: runways.toml plus one file per standard.
# This single file is the bundled fallback when that folder is absent.
# Edit these tables to change regional procedures without rebuilding.
# Categories are matched to the aircraft profile's `cwt` or `wake` field.
# departure rows: leader category, columns: follower category,
# each cell is [full_length, intersection, opposite_direction] seconds.
# arrival rows: leader category, columns: follower category, nautical miles.
version = 1

[runways]
# Parallel runways at or above this separation are independent for surface occupancy.
parallel_independent_m = 760.0
# Wake protection applies to parallel runways closer than this.
parallel_wake_m = 760.0
# Runway headings within this angle are treated as related crossing paths.
crossing_degrees = 12.0

[regions.faa]
label = "FAA CWT"
prefixes = ["K", "PA", "PF", "PH", "PO", "PP"]
category = "cwt"
categories = ["A", "B", "C", "D", "E", "F", "G", "H", "I"]
lua_w_small_behind_heavy = false
max_lua_w_seconds = 90
parallel_wake_m = 762.0
parallel_independent_m = 762.0
arrival = [
  [0, 5, 6, 6, 7, 7, 7, 8, 8],
  [0, 3, 4, 4, 5, 5, 5, 5, 6],
  [0, 0, 0, 0, 3.5, 3.5, 3.5, 5, 6],
  [0, 3, 4, 4, 5, 5, 5, 6, 6],
