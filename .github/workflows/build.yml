name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Linux is the validated runtime target. Add other platforms after native packaging validation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native dependency build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --locked -p openatc-core -p openatc-engine -p openatc-ui -p openatc-plugin -p xtask
      - name: Compile plugin and companion engine
        run: cargo build --locked --release -p openatc-plugin -p openatc-engine
      - name: Audit Linux link dependencies
        run: cargo xtask audit-linux target/release/libopenatc_plugin.so target/release/open-atc-engine
      - name: Engine integration test
        run: |
          cargo xtask test-radio target/release/open-atc-engine speech
          cargo xtask test-crew target/release/open-atc-engine speech
          cargo xtask test-speech target/release/open-atc-engine speech
      - name: Package Rust plugin
        run: cargo xtask package linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: open-atc-linux-x64
          path: packages/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: open-atc-*
          path: release
          merge-multiple: true
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --generate-notes --title "Open ATC $RELEASE_TAG"
