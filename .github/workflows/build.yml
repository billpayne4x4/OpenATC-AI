name: Rust checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native dependency build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --locked -p openatc-core -p openatc-engine -p openatc-ui -p openatc-plugin -p xtask
      - name: Compile plugin and companion engine
        run: cargo build --locked --release -p openatc-plugin -p openatc-engine
      - name: Audit Linux link dependencies
        run: cargo xtask audit-linux target/release/libopenatc_plugin.so target/release/open-atc-engine
      - name: Engine integration test
        run: |
          cargo xtask test-radio target/release/open-atc-engine speech
          cargo xtask test-crew target/release/open-atc-engine speech
          cargo xtask test-speech target/release/open-atc-engine speech
