# ToLiss A320neo (A20N) profile. Call commands are observed in aircraft.crew.
# Confirmed identity: ToLissA320_V1p3p3/a320.acf, Gliding Kiwi, A20N.
# Settings attendantRef/groundRef override these lists; an openatc.toml beside
# the aircraft .acf takes precedence over this bundled profile.
# Control dataref names below exist in the installed neo systems plugin.

[aircraft]
name = "ToLiss A320neo"
match_author = "Gliding Kiwi"
match_icao = ["A20N"]

[aircraft.comms]
attendant_refs = []
ground_refs = []
emer_action = "ignore"

[aircraft.electrical]
bat_volts_ref = "AirbusFBW/BatVolts"
min_volts = 22.0
battery_refs = ["sim/cockpit/electrical/battery_on"]
gpu_refs = ["sim/cockpit2/electrical/GPU_generator_on"]
apu_refs = ["sim/cockpit/electrical/generator_apu_on"]
rmp_refs = ["AirbusFBW/RMP1Available"]
avionics_refs = []
# The custom RMP availability flag is authoritative; the generic avionics
# switch is not the Airbus electrical model. BatVolts and battery_on are
# arrays and are read with their actual SDK types.

# Active radio tuning uses sim/cockpit2/radios/actuators/com1_frequency_hz_833
# (integer kHz, 8.33 channel codes). ToLiss publishes RMP1Switch, RMP1Freq,
# VHF1ActiveFreq and VHFAvail; these are not substituted for the stock tuning
# ref because the stock ref supplies documented channel encoding.

# ToLiss autopilot targets exposed through the stock simulator dials.
[aircraft.radio]
# Active COM1 channel in integer kHz; the RMP mirrors this simulator control.
com1_active_ref = "sim/cockpit2/radios/actuators/com1_frequency_hz_833"

[aircraft.autopilot]
mode_ref = "sim/cockpit/autopilot/autopilot_mode"
altitude_ref = "sim/cockpit/autopilot/altitude"
heading_ref = "sim/cockpit/autopilot/heading_mag"
speed_ref = "sim/cockpit/autopilot/airspeed"

# Crew requests resolve these aliases to these controls, never to an AI-supplied ref.
# Commands are used for ToLiss system buttons. Values are checked after execution.
[aircraft.crew]
cabin_commands = ["AirbusFBW/purser/fwd", "AirbusFBW/purser/aft", "AirbusFBW/ACP1/CABPress"]
ground_commands = ["AirbusFBW/purser/mech", "AirbusFBW/ACP1/INTPress"]
radio_commands = ["AirbusFBW/ACP1/VHF1Press", "AirbusFBW/ACP1/VHF2Press"]

[aircraft.crew.controls.heading]
label = "Heading"
role = "copilot"
dataref = "sim/cockpit/autopilot/heading_mag"
min = 0
max = 359
on = 0

[aircraft.crew.controls.altitude]
label = "Altitude"
role = "copilot"
dataref = "sim/cockpit/autopilot/altitude"
min = 100
max = 49000
on = 100

[aircraft.crew.controls.speed]
label = "Speed"
role = "copilot"
dataref = "sim/cockpit/autopilot/airspeed"
min = 100
max = 350
on = 100

[aircraft.crew.controls.autopilot]
label = "Autopilot one"
role = "copilot"
on_command = "toliss_airbus/ap1_push"
off_command = "toliss_airbus/ap1_push"
readback_ref = "AirbusFBW/AP1Engage"
min = 0
max = 1
integer = true
on = 1
off = 0
airborne_only = true

[aircraft.crew.controls.autothrottle]
label = "Autothrust"
role = "copilot"
on_command = "AirbusFBW/ATHRbutton"
off_command = "AirbusFBW/ATHRbutton"
readback_ref = "AirbusFBW/ATHRmode"
readback_positive = true
min = 0
max = 1
integer = true
on = 1
off = 0

[aircraft.crew.controls.gear]
label = "Landing gear"
role = "copilot"
on_command = "sim/flight_controls/landing_gear_down"
off_command = "sim/flight_controls/landing_gear_up"
readback_ref = "sim/cockpit2/controls/gear_handle_down"
min = 0
max = 1
integer = true
on = 1
off = 0
states = { up = 0, down = 1 }

[aircraft.crew.controls.cabin_brightness]
label = "Cabin lights"
role = "cabin"
dataref = "AirbusFBW/cabinLightLevel_perc"
min = 0
max = 100
on = 100
off = 0
states = { dim = 25 }
tolerance = 1

[aircraft.crew.controls.slides]
label = "Slides"
role = "cabin"
states = { armed = 1, disarmed = 0, automatic = 1, manual = 0 }
on_command = "toliss_airbus/door_commands/arm_slides"
off_command = "toliss_airbus/door_commands/disarm_slides"
readback_ref = "AirbusFBW/SlideArmedArray"
min = 0
max = 1
integer = true
on = 1
off = 0
ground_only = true

[aircraft.crew.controls.chocks]
label = "Chocks"
role = "ground"
dataref = "AirbusFBW/Chocks"
min = 0
max = 1
integer = true
on = 1
off = 0
ground_only = true

[aircraft.crew.controls.external_power]
label = "External power connection"
role = "ground"
dataref = "AirbusFBW/EnableExternalPower"
min = 0
max = 1
integer = true
on = 1
off = 0
ground_only = true

[aircraft.crew.controls.beacon]
label = "Beacon"
role = "copilot"
on_command = "toliss_airbus/lightcommands/BeaconOn"
off_command = "toliss_airbus/lightcommands/BeaconOff"
readback_ref = "sim/cockpit2/switches/beacon_on"
min = 0
max = 1
integer = true
on = 1
off = 0

[aircraft.crew.controls.seatbelts]
label = "Seat belt signs"
role = "copilot"
on_command = "toliss_airbus/lightcommands/FSBSignOn"
off_command = "toliss_airbus/lightcommands/FSBSignOff"
readback_ref = "sim/cockpit2/switches/fasten_seat_belts"
min = 0
max = 1
integer = true
on = 1
off = 0

# Short editable examples, not a replacement for your operator's checklist.
[[aircraft.crew.checklists.before_start]]
control = "seatbelts"
challenge = "checklist_seatbelts"
response = "crew_state_on"
value = 1
[[aircraft.crew.checklists.before_start]]
control = "beacon"
challenge = "checklist_beacon"
response = "crew_state_on"
value = 1
[[aircraft.crew.checklists.after_takeoff]]
control = "gear"
challenge = "checklist_gear"
response = "crew_state_up"
value = 0
[[aircraft.crew.checklists.parking]]
control = "beacon"
challenge = "checklist_beacon"
response = "crew_state_off"
value = 0
[[aircraft.crew.checklists.parking]]
control = "seatbelts"
challenge = "checklist_seatbelts"
response = "crew_state_off"
value = 0

[aircraft.crew.controls.flaps]
label = "Flaps"
role = "copilot"
dataref = "sim/cockpit2/controls/flap_ratio"
min = 0
max = 4
integer = true
on = 4
off = 0
write_scale = 0.25
readback_scale = 4
states = { up = 0, one = 1, two = 2, three = 3, full = 4 }
tolerance = 0.05

[aircraft.crew.controls.speedbrakes]
label = "Speed brakes"
role = "copilot"
dataref = "sim/cockpit2/controls/speedbrake_ratio"
min = -0.5
max = 1
integer = true
on = -0.5
off = 0
states = { armed = -0.5, disarmed = 0, retract = 0, full = 1 }
tolerance = 0.01

[aircraft.crew.controls.parking_brake]
label = "Parking brake"
role = "copilot"
on_command = "toliss_airbus/park_brake_set"
off_command = "toliss_airbus/park_brake_release"
readback_ref = "AirbusFBW/ParkBrake"
min = 0
max = 1
integer = true
on = 1
off = 0
ground_only = true
states = { set = 1, release = 0, released = 0 }

[aircraft.crew.controls.apu_bleed]
