# Local ATC procedure per departure region, matched by ICAO prefix.
# pressure: "qnh" (hectopascals) or "altimeter" (inches of mercury).
# altitude: "feet" or "meters" for clearances and advisories.
# clearance: "initial" (US-style maintain/expect) or "sid" (ICAO climb-via-SID).
# transition_feet: where flight levels take over. Values are national defaults;
# real transition altitudes are per-airfield in Europe/Russia/China, so treat
# these as fallbacks when no airport record overrides them.
# center_khz: optional area-control fallback frequency. Absent means
# uncontrolled enroute airspace — enroute coverage then comes only from
# airports within range, and everywhere else nobody answers. No region sets
# one yet; add published ACC fallbacks here when sourced.

[regions.us]
prefixes = ["K", "P", "T"]
pressure = "altimeter"
altitude = "feet"
clearance = "initial"
transition_feet = 18000

[regions.canada]
prefixes = ["C"]
pressure = "altimeter"
altitude = "feet"
clearance = "initial"
transition_feet = 18000

