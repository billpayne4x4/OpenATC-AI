# OpenATC intent catalogue: every pilot request the system recognises.
#
# Policy (audit later):
# - `atc` + `copilot` work the radio, so every ATC intent lists both roles.
#   `emergency` and `conversation` are open to all four roles: anyone aboard
#   can declare, and anyone can talk when nothing ATC-specific matches.
# - `catalogue = true` mirrors the C++ `requestDefinitions` UI buttons
#   exactly (title, group, parameter). `altimeter`/`weather` are parser-only:
#   reachable by exact phrase, like C++ `interpretText`, with no button.
# - `pattern` documents how the intent is recognised, mirroring C++ order:
#   "exact" (exact phrases plus the lowercased title), "substring"
#   (emergency scan), "altitude"/"direct" (slot regexes), "none".
# - Examples come in three kinds. `request` examples are pilot utterances that
#   stay exactly parseable (bare phrases, no callsign prefix; placeholders
#   must render back to a parseable string). `say` examples are controller
#   transmissions or callsign-bearing pilot calls: multi-sentence, free-form,
#   the AI's style material and the AI-off fallback source. `readback`
#   examples are pilot readbacks honouring the mandatory-items rule (route,
#   runway, altitude, squawk, QNH, frequency must be read back).
# - `variant` is icao (default) or faa (CRAFT-style delivery, "cleared for
#   takeoff" phrasing, altimeter-inches).
#
# Placeholder grammar (renderer fills from the parsed request, voice-implicit:
# no UI modal is shown, the slot arrives with the utterance):
# - `{alt}` renders "5000 feet", or "" when empty. `{alt|3000}` falls back.
# - `{wpt}` `{callsign}` `{dest}` `{rwy}` `{sq}` `{qnh}` `{sid}` `{freq}`
#   `{via}` `{stand}` `{wind}` `{atis}` render literally, or "" when empty.
# Substitution is literal: no whitespace collapsing, no quoting.

[intent.clearance]
title = "Request IFR clearance"
group = "Ground"
catalogue = true
parameter = false
roles = ["atc", "copilot"]
exact = ["request clearance"]
pattern = "exact"
slots = []
examples = [
  { text = "request ifr clearance", kind = "request" },
  { text = "request clearance", kind = "request" },
  { text = "{callsign} on stand {stand}, information {atis}, request clearance to {dest}", kind = "say" },
  { text = "{callsign} with {atis}, request IFR clearance to {dest}", kind = "say" },
  { text = "{callsign}, cleared to {dest} as filed via {sid} runway {rwy}. Initial climb {alt}, squawk {sq}.", kind = "say" },
  { text = "{callsign}, cleared to {dest} via {sid}. Climb via SID, squawk {sq}. QNH {qnh}.", kind = "say" },
  { text = "{callsign}, cleared to {dest} airport as filed. Climb and maintain {alt}, expect higher one zero minutes after departure. Departure frequency {freq}, squawk {sq}.", kind = "say", variant = "faa" },
  { text = "Cleared to {dest} via {sid}, runway {rwy}, initial climb {alt}, squawk {sq}, {callsign}.", kind = "readback" },
  { text = "{callsign}, correct. Information {atis}, QNH {qnh}.", kind = "say" },
]
fallback = "{callsign}, cleared to {dest} as filed via {sid} runway {rwy}. Initial climb {alt}, squawk {sq}. Read back altitude, route and squawk."

