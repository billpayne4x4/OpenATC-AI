# Operational speech. Every phrase must keep all declared placeholders.

[generated_arrival_speed]
slots = ["callsign", "speed"]
say = ["{callsign}, reduce speed to {speed} knots until commencing final approach, then resume published speed."]

[pilot_generated_arrival_speed]
slots = ["callsign", "speed"]
say = ["Reducing to {speed} knots until final approach, then published speed, {callsign}."]

[generated_arrival_speed_cancelled]
slots = ["callsign"]
say = ["{callsign}, cancel speed adjustment, maintain the cleared route and published speeds."]

[arrival_traffic_hold]
slots = ["callsign", "fix", "direction", "course", "altitude", "speed", "delay"]
say = ["{callsign}, cleared to {fix}, hold {direction} on the {course} inbound course, right turns, one minute legs. Maintain {altitude} feet, maximum holding speed {speed} knots. Arrival traffic, expect further clearance at {delay} Zulu."]

[pilot_arrival_traffic_hold]
slots = ["callsign", "fix", "direction", "course", "altitude", "speed", "delay"]
say = ["Cleared to {fix}, hold {direction}, inbound course {course}, right turns, one minute legs, {altitude} feet, maximum {speed} knots, expect further clearance at {delay} Zulu, {callsign}."]

[arrival_hold_onward]
slots = ["callsign", "fix"]
say = ["{callsign}, leave the hold at {fix}, resume the last cleared route, maintain assigned altitude. Expect approach clearance."]

[pilot_arrival_hold_onward]
slots = ["callsign", "fix"]
say = ["Leaving the hold at {fix}, resuming last cleared route, maintaining assigned altitude, {callsign}."]

[arrival_hold_extended]
slots = ["callsign", "fix", "delay"]
say = ["{callsign}, continue holding at {fix}, arrival traffic. Expect further clearance at {delay} Zulu."]

[pilot_arrival_hold_extended]
slots = ["callsign", "fix", "delay"]
say = ["Continuing hold at {fix}, expect further clearance at {delay} Zulu, {callsign}."]

[arrival_hold_unable]
slots = ["callsign"]
say = ["{callsign}, roger unable holding. Maintain the last cleared route and altitude, standby for resequencing."]

[arrival_hold_amendment_required]
slots = ["callsign", "fix"]
say = ["{callsign}, holding clearance at {fix} remains in effect. Standby for an onward clearance."]

[crew_social_ground_farewell]
slots = []
match_any = ["have a good day", "have a nice day", "have a good night", "goodbye", "see you", "take care"]
match_priority = 30
when = { role = "ground" }
say = ["Thanks, Captain. You too—have a good flight!", "You too, Captain. Safe flight, and we'll see you next time.", "Cheers, Captain. Have a good flight!", "Thanks, Captain. Take care up there."]

[crew_social_cabin_farewell]
slots = []
match_any = ["have a good day", "have a nice day", "have a good night", "goodbye", "see you", "take care"]
match_priority = 30
when = { role = "cabin" }
say = ["Thank you, Captain. You too!", "You too, Captain. Give us a call if you need anything.", "Thanks, Captain. Take care."]

[crew_social_copilot_farewell]
slots = []
match_any = ["have a good day", "have a nice day", "have a good night", "goodbye", "see you", "take care"]
match_priority = 30
when = { role = "copilot" }
say = ["Thanks, Captain. You too.", "You too, Captain!", "Cheers, Captain. Take care."]

[crew_social_greeting]
slots = []
match_any = ["hello", "hi", "good morning", "good evening", "how are you", "how is it going", "how's it going"]
match_priority = 10
when = { role = ["ground", "cabin", "copilot"] }
say = ["Hello, Captain. Good to hear from you.", "All good here, Captain. How are you?", "Hello, Captain. How can I help?", "Doing well, thanks, Captain. How about you?"]

[crew_social_thanks]
slots = []
match_any = ["thanks", "thank you", "cheers", "much appreciated", "well done", "nice work"]
match_priority = 20
when = { role = ["ground", "cabin", "copilot"] }
say = ["You're welcome, Captain.", "No worries, Captain. Happy to help.", "My pleasure, Captain.", "Thanks, Captain. Glad to help."]

