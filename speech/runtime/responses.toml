# Pilot speech for the manual ATC Auto Reply button. Values come from the clearance.
[pilot_ifr_readback]
slots = ["destination", "route", "altitude", "squawk", "runway", "callsign"]
say = [
  "Cleared to {destination}, route {route}, initial altitude {altitude} feet, squawk {squawk}, runway {runway}, {callsign}.",
  "{callsign}, cleared to {destination} via {route}, initial altitude {altitude} feet, squawk {squawk}, departure runway {runway}.",
]

[pilot_taxi_readback]
slots = ["instructions", "callsign"]
say = ["{instructions} {callsign}.", "{callsign}, {instructions}"]

[pilot_start_ack]
slots = ["callsign"]
say = ["Start-up approved, will report ready for pushback, {callsign}.", "{callsign}, start-up approved; will report ready for pushback."]

[pilot_pushback_ack]
slots = ["callsign"]
say = ["Pushback approved, will advise ready to taxi, {callsign}.", "{callsign}, pushback approved; will report ready to taxi."]

[pilot_start_pushback_ack]
slots = ["callsign"]
say = ["Start-up and pushback approved, will advise ready to taxi, {callsign}.", "{callsign}, start-up and pushback approved; will report ready to taxi."]

[pilot_reply_no_pending]
slots = []
say = ["That instruction is no longer awaiting your reply. Check the current clearance.", "No matching acknowledgment is pending; check your current clearance."]

[taxi_inferred_start_missing]
slots = []
say = ["No connected painted taxi centerline within 35 meters on clear pavement. Automatic taxi guidance is unavailable from this position.", "Unable to join the scenery centerline safely from this position. Automatic taxi guidance is unavailable from this position."]

[runway_taxi_backtrack]
slots = ["runway"]
say = [
  "Taxi onto runway {runway}, backtrack to the departure end. Stop and hold position; report ready to Tower. This is not a takeoff clearance.",
  "Backtrack runway {runway} to the departure end, stop and hold position. Report ready to Tower; takeoff clearance is required.",
]

[runway_taxi_contact_tower]
slots = []
say = [
  "Runway taxi or backtracking requires Tower clearance. Hold position and contact this airport's Tower, then request runway backtrack.",
  "Hold position. Contact the airport Tower for runway taxi or backtrack clearance before entering the runway.",
]

[runway_taxi_unavailable]
slots = []
say = [
  "Unable to establish a connected runway taxi route from the installed pavement. Hold position; no runway entry is authorized.",
  "No connected paved route to the assigned runway can be verified. Hold position; runway entry is not authorized.",
]

[readback_field_runway_taxi]
slots = []
say = ["runway backtrack and stop-and-hold-position instruction"]

[taxi_hold_for_backtrack]
slots = ["via", "runway"]
say = [
  "Taxi via {via} to the holding point, hold short of runway {runway}. Report at the holding point to Tower.",
  "Taxi via {via}, hold short of runway {runway} at the marked holding point. Contact Tower at the holding point.",
]

[readback_scope_changed]
slots = []
say = ["That readback belongs to an earlier instruction. Read back the current clearance.", "The pending instruction has changed. Say again using your current clearance."]

[pilot_taxi_hold_readback]
slots = ["via", "runway", "callsign"]
say = ["Taxi via {via}, hold short of runway {runway}, {callsign}.", "{callsign}, taxi via {via}, holding short of runway {runway}."]

[taxi_via_runway_backtrack]
slots = ["entry_runway", "runway"]
say = ["Taxi via runway {entry_runway}, backtrack runway {runway} to the departure end. Stop and hold position; report ready to Tower.", "Taxi via runway {entry_runway}. Backtrack runway {runway} to the departure end, stop and hold position. Report ready to Tower."]

[pilot_runway_taxi_readback]
slots = ["entry_runway", "runway", "callsign"]
say = ["Taxi via runway {entry_runway}, backtrack runway {runway}, stop and hold position at the departure end, {callsign}.", "{callsign}, taxi via runway {entry_runway}, backtrack runway {runway}, stop and hold position at the departure end."]

[runway_taxi_readback_correct]
slots = []
say = ["Runway taxi readback correct. Backtrack as cleared, stop and hold position at the departure end.", "Correct runway taxi readback. Stop and hold position at the cleared departure end."]

[taxi_to_holding_point]
slots = ["runway"]
say = ["Taxi to the holding point for runway {runway}. Hold short of runway {runway}.", "Taxi to runway {runway} holding point, hold short of runway {runway}."]

[taxi_toward_parking_hold]
slots = ["destination"]
say = ["Taxi toward {destination}, then hold position. Stand by for further instructions.", "Taxi toward {destination} and hold position. Await further instructions."]

[pilot_taxi_holding_point_readback]
slots = ["runway", "callsign"]
say = ["Taxi to the holding point, hold short of runway {runway}, {callsign}.", "Holding point for runway {runway}, hold short of runway {runway}, {callsign}."]

[holding_standby]
slots = ["runway"]
say = ["Hold short of runway {runway}, stand by.", "Hold short of runway {runway}. Await further instructions."]
[holding_runway_occupied]
slots = ["runway"]
say = ["Hold short of runway {runway}, runway occupied.", "Runway {runway} occupied. Hold short."]
[holding_traffic_final]
slots = ["runway"]
say = ["Hold short of runway {runway}, traffic on final.", "Traffic on final, hold short of runway {runway}."]
[holding_report_ready]
slots = ["runway"]
say = ["Hold short of runway {runway}. Report ready for further taxi clearance.", "Hold short of runway {runway}, report ready."]

[pilot_holding_ready]
slots = ["callsign"]
say = ["{callsign}, holding point, ready for departure.", "{callsign}, ready for departure at the holding point."]
