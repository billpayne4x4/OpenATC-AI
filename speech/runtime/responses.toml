say = ["{callsign}, clearance cancelled due to continued noncompliance. Say intentions and request an amended clearance.", "{callsign}, repeated deviation from your clearance. Clearance cancelled. Say intentions.", "{callsign}, clearance cancelled. Request revised instructions before continuing under that clearance."]

[arrival_vacate]
slots = ["callsign", "runway", "side"]
say = ["{callsign}, vacate runway {runway} {side}. Report runway vacated.", "{callsign}, vacate runway {runway} {side} when able and report clear.", "{callsign}, report clear of runway {runway} {side}."]

[arrival_vacate_any]
slots = ["callsign", "runway"]
say = ["{callsign}, vacate runway {runway}. Report runway vacated.", "{callsign}, vacate runway {runway} when able and report clear.", "{callsign}, report clear of runway {runway}."]

[arrival_vacate_taxiway]
slots = ["callsign", "runway", "side", "taxiway"]
say = ["{callsign}, vacate runway {runway} {side} via taxiway {taxiway}. Report runway vacated.", "{callsign}, vacate {side} via taxiway {taxiway} when able. Report clear of runway {runway}.", "{callsign}, exit the runway {runway} {side} at taxiway {taxiway}. Report runway vacated."]

[arrival_ils_clearance]
slots = ["callsign", "runway"]
say = ["{callsign}, cleared ILS approach runway {runway}. Report established.", "{callsign}, runway {runway}, cleared ILS approach. Report established on the localizer."]

[arrival_not_established]
slots = ["callsign", "runway"]
say = ["{callsign}, report established on final runway {runway}. Landing clearance not issued.", "{callsign}, landing clearance pending. Report final runway {runway}."]

[compliance_amendment_required]
slots = []
say = ["Your previous clearance is cancelled. Request an amended altitude or route."]

