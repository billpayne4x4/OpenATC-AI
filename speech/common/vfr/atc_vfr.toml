# Editable examples: see speech/README.md. One entry describes one event.

[vfr.join_downwind]
service = ["Tower", "Approach"]
role = "atc"
phase = ["departure", "cruise", "arrival", "approach"]
variant = "common"
situation = ["join_downwind"]
slots = ["callsign", "rwy", "turn"]
say = [
  "{callsign}, join {turn}-hand downwind runway {rwy}. Report downwind.",
  "{callsign}, runway {rwy}, join downwind {turn}-hand circuit. Report downwind.",
  "{callsign}, join downwind for runway {rwy}, {turn}-hand. Call downwind.",
]

[vfr.join_base]
service = ["Tower", "Approach"]
role = "atc"
phase = ["departure", "cruise", "arrival", "approach"]
variant = "common"
situation = ["join_base"]
slots = ["callsign", "rwy", "turn"]
say = [
  "{callsign}, join {turn}-hand base runway {rwy}. Report base.",
  "{callsign}, runway {rwy}, join {turn} base. Call base.",
  "{callsign}, join base runway {rwy}, {turn}-hand. Report established on base.",
]

