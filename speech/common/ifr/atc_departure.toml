slots = ["alt", "callsign", "sid"]
say = [
  "{callsign}, resume {sid}, climb to {alt}.",
  "{callsign}, rejoin {sid} departure and climb to {alt}.",
  "{callsign}, resume the {sid} procedure, altitude {alt}.",
]

