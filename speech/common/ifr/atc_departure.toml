# Editable examples: see speech/README.md. One entry describes one event.

[departure.radar_identified]
service = ["Departure"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["radar_identified"]
slots = ["alt", "callsign"]
say = [
  "{callsign}, identified. Climb to {alt}.",
  "{callsign}, radar contact, climb to {alt}.",
  "{callsign}, radar identified. Continue climb to {alt}.",
]

[departure.runway_heading]
service = ["Departure"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["runway_heading"]
slots = ["alt", "callsign"]
say = [
  "{callsign}, fly runway heading, climb to {alt}.",
  "{callsign}, runway heading, climb to {alt}.",
  "{callsign}, maintain runway heading and climb to {alt}.",
]

[departure.heading_after_departure]
service = ["Departure"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["heading_after_departure"]
slots = ["alt", "callsign", "heading", "turn"]
say = [
  "{callsign}, turn {turn} heading {heading}, climb to {alt}.",
  "{callsign}, climb to {alt}, turn {turn} heading {heading}.",
  "{callsign}, {turn} turn to heading {heading} and climb to {alt}.",
]

[departure.resume_sid]
service = ["Departure"]
