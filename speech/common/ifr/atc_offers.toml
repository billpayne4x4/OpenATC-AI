# Editable examples: see speech/README.md. One entry describes one event.

[offer.shortcut]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["cruise", "arrival"]
variant = "common"
situation = ["ahead_of_schedule", "direct_available"]
slots = ["callsign", "nm", "wpt"]
say = [
  "{callsign}, can you accept direct {wpt}, saving approximately {nm}?",
  "{callsign}, would you like direct {wpt}, saving approximately {nm}? Advise able.",
  "{callsign}, direct {wpt}, saving approximately {nm} is available. Say if you can accept.",
]
accept = "{callsign}, able to accept direct {wpt}, saving approximately {nm}."
decline = "{callsign}, unable to accept direct {wpt}, saving approximately {nm}."
effect = "amend_route"

