# Editable examples: see speech/README.md. One entry describes one event.

[enroute.climb]
service = ["Approach", "Departure"]
role = "atc"
phase = ["departure", "cruise"]
variant = "common"
situation = ["climb_request"]
slots = ["alt", "callsign"]
say = [
  "{callsign}, climb to {alt}.",
  "{callsign}, climb and maintain {alt}.",
  "{callsign}, climb to altitude {alt}.",
]

