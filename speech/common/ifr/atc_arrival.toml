# Editable examples: see speech/README.md. One entry describes one event.

[arrival.top_of_descent]
service = ["Approach"]
role = "atc"
phase = ["cruise", "arrival"]
variant = "common"
situation = ["descent_planning"]
slots = ["callsign", "mins"]
say = [
  "{callsign}, expect descent in {mins}. Maintain present level.",
  "{callsign}, maintain present level, expect descent after {mins}.",
  "{callsign}, descent expected in {mins}; remain at present level until cleared.",
]

[arrival.ils]
service = ["Approach"]
role = "atc"
phase = ["approach"]
variant = "common"
situation = ["approach_clearance"]
slots = ["alt", "callsign", "rwy"]
say = [
  "{callsign}, maintain {alt} until established on the localizer. Cleared ILS runway {rwy} approach.",
  "{callsign}, cleared ILS approach runway {rwy}, maintain {alt} until established on the localizer.",
  "{callsign}, ILS runway {rwy} approach cleared. Maintain {alt} until localizer established.",
]

