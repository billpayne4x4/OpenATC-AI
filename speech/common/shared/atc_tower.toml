# Editable examples: see speech/README.md. One entry describes one event.

[tower.lineup]
service = ["Tower"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["lineup"]
slots = ["callsign", "rwy"]
say = [
  "{callsign}, runway {rwy}, line up and wait.",
  "{callsign}, line up and wait, runway {rwy}.",
  "{callsign}, line up on runway {rwy} and wait.",
]

[tower.takeoff]
service = ["Tower"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["takeoff"]
slots = ["callsign", "rwy", "wind"]
say = [
  "{callsign}, wind {wind}, runway {rwy}, cleared for takeoff.",
  "{callsign}, runway {rwy}, cleared for takeoff. Wind {wind}.",
  "{callsign}, surface wind {wind}. Cleared for takeoff, runway {rwy}.",
]

[tower.takeoff_immediate]
service = ["Tower"]
role = "atc"
phase = ["departure"]
variant = "common"
situation = ["immediate_departure_readiness"]
slots = ["callsign", "rwy"]
say = [
  "{callsign}, are you ready for immediate departure from runway {rwy}?",
  "{callsign}, advise ready for immediate departure, runway {rwy}.",
  "{callsign}, confirm able to depart immediately from runway {rwy}.",
]

[tower.landing]
