# Editable examples: see speech/README.md. One entry describes one event.

[chatter.check_in]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["departure", "cruise", "arrival"]
variant = "common"
situation = ["initial_contact"]
slots = ["alt", "callsign"]
say = [
  "{callsign}, radar contact. Maintain {alt}.",
  "{callsign}, identified, maintain {alt}.",
  "{callsign}, radar identified. Remain at {alt}.",
]

