phase = ["departure", "approach"]
variant = "common"
situation = ["wake_turbulence"]
slots = ["callsign", "traffic"]
say = [
  "{callsign}, caution wake turbulence from {traffic}.",
  "{callsign}, wake turbulence caution, {traffic}.",
  "{callsign}, caution, wake turbulence associated with {traffic}.",
]

