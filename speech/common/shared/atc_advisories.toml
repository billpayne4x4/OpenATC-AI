# Editable examples: see speech/README.md. One entry describes one event.

[advisory.traffic]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["cruise", "arrival", "approach"]
variant = "common"
situation = ["traffic"]
slots = ["callsign", "traffic"]
say = [
  "{callsign}, traffic {traffic}. Report in sight.",
  "{callsign}, traffic information: {traffic}. Advise when in sight.",
  "{callsign}, reported traffic {traffic}. Report visual contact.",
]

[advisory.traffic_nofactor]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["cruise", "arrival"]
variant = "common"
situation = ["traffic_resolved"]
slots = ["callsign"]
say = [
  "{callsign}, traffic no longer a factor.",
  "{callsign}, previously reported traffic is no factor.",
  "{callsign}, traffic information cancelled; no longer a factor.",
]

[advisory.wake]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
