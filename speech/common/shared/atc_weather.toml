# Editable examples: see speech/README.md. One entry describes one event.

[weather.wind]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["parked", "taxi", "departure", "cruise", "arrival", "approach"]
variant = "common"
situation = ["wind"]
slots = ["callsign", "wind"]
say = [
  "{callsign}, surface wind {wind}.",
  "{callsign}, current surface wind is {wind}.",
  "{callsign}, wind report: {wind}.",
]

