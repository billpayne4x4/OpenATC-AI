# Editable examples: see speech/README.md. One entry describes one event.

[ground.pushback_approved]
service = ["Ground"]
role = "atc"
phase = ["parked"]
variant = "common"
situation = ["pushback_request"]
slots = ["callsign", "direction"]
say = [
  "{callsign}, pushback approved, facing {direction}.",
  "{callsign}, approved to push back, face {direction}.",
  "{callsign}, pushback is approved with the aircraft facing {direction}.",
]

