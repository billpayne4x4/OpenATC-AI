# Editable examples: see speech/README.md. One entry describes one event.

[readback.altitude]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["clearance", "pushback", "taxi", "departure", "cruise", "arrival", "approach", "landed", "taxi_in"]
variant = "common"
situation = ["altitude"]
slots = ["alt", "callsign"]
say = [
  "{callsign}, read back assigned altitude {alt}.",
  "{callsign}, confirm altitude {alt} in your readback.",
  "{callsign}, altitude readback required, {alt}.",
]

