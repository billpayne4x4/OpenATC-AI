# Editable examples: see speech/README.md. One entry describes one event.

[emergency.engine_failure]
service = ["Clearance", "Ground", "Tower", "Approach", "Departure"]
role = "atc"
phase = ["departure", "cruise", "arrival"]
variant = "common"
situation = ["engine_failure", "distress"]
slots = ["callsign"]
say = [
  "{callsign}, engine failure acknowledged. Say intentions.",
  "{callsign}, roger engine failure. Advise intentions.",
  "{callsign}, received, engine failure. State your intentions.",
]

